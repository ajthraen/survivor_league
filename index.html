<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survivor League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0E1512;
    --surface: #161F1B;
    --surface-2: #1D2823;
    --line: #2A362F;
    --text: #EEEBE1;
    --muted: #8FA096;
    --accent: #E7B23D;
    --accent-dim: #6b5a2c;
    --turf: #4F8F5B;
    --danger: #B5615A;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3,.display{ font-family: var(--font-display); font-weight:700; letter-spacing:0.2px; }
  a{color:inherit;}
  button{ font-family: var(--font-body); cursor:pointer; }
  select, input{ font-family: var(--font-body); }

  #banner{
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, #1B2620 0%, #141C18 100%);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  #banner .brand{ font-family:var(--font-display); font-size:22px; font-weight:800; color:var(--text); display:flex; align-items:center; gap:10px;}
  #banner .brand .dot{ width:10px;height:10px;border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}
  #banner .clock{ display:flex; align-items:baseline; gap:10px; }
  #banner .clock .label{ color:var(--muted); font-size:12px; }
  #banner .clock .time{ font-family:var(--font-display); font-size:26px; color:var(--accent); letter-spacing:1px; }

  nav{
    display:flex; gap:2px; background:var(--surface); border-bottom:1px solid var(--line);
    padding: 0 20px; overflow-x:auto;
  }
  nav button{
    background:none; border:none; color:var(--muted); padding:14px 16px;
    font-size:14px; font-weight:600; border-bottom:2px solid transparent; white-space:nowrap;
  }
  nav button.active{ color:var(--text); border-bottom:2px solid var(--accent); }
  nav .spacer{flex:1;}
  nav .account-btn{ color:var(--accent); }

  main{ max-width:920px; margin:0 auto; padding: 24px 20px 80px; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:6px;
    padding:20px; margin-bottom:16px;
  }
  .card-accent{ border-left:3px solid var(--accent); }
  .muted{ color:var(--muted); }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .grid{ display:grid; gap:12px; }
  label{ display:block; font-size:13px; color:var(--muted); margin-bottom:5px; }
  select, input[type=text], input[type=password], input[type=number]{
    background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:4px;
    padding:9px 10px; font-size:14px; width:100%;
  }
  .btn{
    background:var(--accent); color:#20180a; border:none; border-radius:4px; padding:10px 16px;
    font-weight:700; font-size:14px;
  }
  .btn:disabled{ background:var(--line); color:var(--muted); cursor:not-allowed; }
  .btn-outline{
    background:transparent; border:1px solid var(--line); color:var(--text); border-radius:4px; padding:9px 14px; font-size:13px; font-weight:600;
  }
  .btn-danger{ background:var(--danger); color:#2a1211; }
  .field{ margin-bottom:12px; }
  .hr{ border:none; border-top:1px solid var(--line); margin:16px 0; }
  .team-tile{
    background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:12px 14px; flex:1; min-width:130px;
  }
  .team-tile .tname{ font-family:var(--font-display); font-size:19px; font-weight:700; }
  .team-tile .trecord{ font-size:12px; color:var(--muted); margin-top:2px; }
  .vs{ color:var(--muted); font-family:var(--font-display); font-size:16px; padding:0 6px;}
  .matchup{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .score{ font-family:var(--font-display); font-size:22px; font-weight:700; }
  .winner{ color:var(--accent); }
  .pill{ display:inline-block; padding:2px 9px; border-radius:20px; font-size:11px; font-weight:700; }
  .pill-live{ background:#5a2c2c; color:#f0a; color:#ff8f7a;}
  .pill-final{ background:#22301f; color:var(--turf); }
  .pill-scheduled{ background:var(--surface-2); color:var(--muted); }
  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:9px 6px; border-bottom:1px solid var(--line); font-size:14px; }
  th{ color:var(--muted); font-weight:600; font-size:12px; text-transform:none;}
  .eliminated-row td{ color:#6b7770; }
  .eliminated-row .name{ color:#7d8e83; }
  .badge-out{ color:var(--danger); font-size:12px; font-weight:700; margin-left:8px;}
  .empty{ color:var(--muted); font-style:italic; padding:20px 0; text-align:center; }
  .msg{ padding:10px 12px; border-radius:4px; font-size:14px; margin-bottom:14px; }
  .msg-error{ background:#3a2020; color:#ffb3a7; border:1px solid #5c2b2b;}
  .msg-ok{ background:#1c3324; color:#a7e3bb; border:1px solid #2c5138;}
</style>
</head>

function resolveTeamName(raw){
  const cleaned = raw.trim().toUpperCase().replace(/\s+/g,' ');
  if(TEAM_NAME_LOOKUP[cleaned]) return TEAM_NAME_LOOKUP[cleaned];
  const words = cleaned.split(' ');
  const lastWord = words[words.length-1];
  if(TEAM_NAME_LOOKUP[lastWord]) return TEAM_NAME_LOOKUP[lastWord];
  const firstWord = words[0];
  if(TEAM_NAME_LOOKUP[firstWord]) return TEAM_NAME_LOOKUP[firstWord];
  return null;
}

function friendlyAuthError(e){
  const c = (e && e.code) || '';
  if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-login-credentials'].includes(c)) return 'Incorrect display name or password.';
  if(c==='auth/too-many-requests') return 'Too many attempts — wait a few minutes and try again.';

}

// --- Window timestamps: the server enforces the pick window using these absolute times ---
function etOffsetMinutes(utcMsRaw){
  const utcMs = Math.floor(utcMsRaw/1000)*1000; // whole seconds, so the offset is exact
  const dtf = new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const p = Object.fromEntries(dtf.formatToParts(new Date(utcMs)).map(x=>[x.type,x.value]));
  const asUtc = Date.UTC(+p.year, +p.month-1, +p.day, +p.hour, +p.minute, +p.second);
  return (asUtc - utcMs) / 60000;
}
function fakeEtToUtcMs(d){
  const guess = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds(), d.getMilliseconds());
  let utc = guess - etOffsetMinutes(guess)*60000;
  utc = guess - etOffsetMinutes(utc)*60000;
  return utc;
}
function refreshWindowTimestamps(){
  const o = getOpenSettings(), c = getCloseSettings();
  const lastOpen = mostRecentOccurrence(o.day, o.hour, o.minute, false);
  const lastClose = mostRecentOccurrence(c.day, c.hour, c.minute, true);
  let openFake, closeFake;
  if(lastOpen > lastClose){
    openFake = lastOpen;
    closeFake = nextOccurrence(c.day, c.hour, c.minute, true);
  } else {
    openFake = nextOccurrence(o.day, o.hour, o.minute, false);
    closeFake = new Date(openFake);
    closeFake.setDate(closeFake.getDate() + ((c.day - o.day + 7) % 7));
    closeFake.setHours(c.hour, c.minute, 59, 999);
    if(closeFake <= openFake) closeFake.setDate(closeFake.getDate() + 7);
  }
  state.meta.openAtMs = fakeEtToUtcMs(openFake);
  state.meta.closeAtMs = fakeEtToUtcMs(closeFake);
}

// --- Turn the in-memory state into Firestore documents (and back) ---
function nameOfUser(userId){ const u = state.users.find(x=>x.id===userId); return u ? u.displayName : ''; }
function buildDocs(){
  const docs = {};
  docs['league/meta'] = state.meta;
  const weeks = {};
  Object.keys(state.games).forEach(w=>{ weeks[w] = state.games[w]; });
  docs['league/games'] = { weeks };
  docs['league/roundups'] = { posts: state.roundupPosts || [] };
  const pendingIds = new Set(state.users.filter(u=>u.pending).map(u=>u.id));
  state.users.forEach(u=>{
    if(u.pending) return;
    docs['players/'+u.id] = { displayName: u.displayName, isAdmin: !!u.isAdmin, mustChange: !!u.mustChange };
  });
  state.entries.forEach(e=>{
    if(pendingIds.has(e.userId)) return;
    docs['entries/'+e.id] = {
      ownerUid: e.userId, ownerName: nameOfUser(e.userId) || e.ownerName || '',
      label: e.label, eliminated: !!e.eliminated,
      eliminatedWeek: (e.eliminatedWeek ?? null), picks: e.picks || {}
    };
  });
  return docs;
}
function toFirestore(path, data){
  const clean = JSON.parse(JSON.stringify(data));
  if(path === 'league/meta'){
    if(clean.openAtMs) clean.openAt = Timestamp.fromMillis(clean.openAtMs);
    if(clean.closeAtMs) clean.closeAt = Timestamp.fromMillis(clean.closeAtMs);
    delete clean.openAtMs; delete clean.closeAtMs;
  }
  return clean;
}
function docRefFor(path){ return doc(db, ...path.split('/')); }

async function loadAll(){
  const userId = fbUser.uid;
  const meSnap = await getDoc(doc(db,'players',userId));
  if(!meSnap.exists()){
    await signOut(auth);
    throw new Error('Your login exists, but you are not part of the league yet. Ask the commissioner to add you.');
  }
  myProfile = { id: userId, ...meSnap.data() };
  const [metaSnap, gamesSnap, roundSnap, entriesSnap] = await Promise.all([
    getDoc(doc(db,'league','meta')), getDoc(doc(db,'league','games')),
    getDoc(doc(db,'league','roundups')), getDocs(collection(db,'entries'))
  ]);
  const s = defaultState();
  if(metaSnap.exists()){
    const m = metaSnap.data();
    const openAt = m.openAt, closeAt = m.closeAt;
    delete m.openAt; delete m.closeAt;
    s.meta = { ...s.meta, ...m };
    if(openAt && openAt.toMillis) s.meta.openAtMs = openAt.toMillis();
    if(closeAt && closeAt.toMillis) s.meta.closeAtMs = closeAt.toMillis();
  }
  if(gamesSnap.exists()){
    const w = gamesSnap.data().weeks || {};
    s.games = {};
    Object.keys(w).forEach(k=>{ s.games[Number(k)] = w[k]; });
  }
  if(roundSnap.exists()) s.roundupPosts = roundSnap.data().posts || [];
  s.entries = entriesSnap.docs.map(d=>{
    const x = d.data();
    return { id: d.id, userId: x.ownerUid, ownerName: x.ownerName, label: x.label,
             eliminated: !!x.eliminated, eliminatedWeek: x.eliminatedWeek ?? null, picks: x.picks || {} };
  });
  let playersLoaded = false;
  if(myProfile.isAdmin){
    const pSnap = await getDocs(collection(db,'players'));
    s.users = pSnap.docs.map(d=>({ id: d.id, displayName: d.data().displayName, isAdmin: !!d.data().isAdmin, mustChange: !!d.data().mustChange }));
    playersLoaded = true;
  } else {
    const seen = new Map();
    s.entries.forEach(e=>{ if(!seen.has(e.userId)) seen.set(e.userId, { id: e.userId, displayName: e.ownerName || '', isAdmin: false }); });
    seen.set(userId, { id: userId, displayName: myProfile.displayName, isAdmin: !!myProfile.isAdmin, mustChange: !!myProfile.mustChange });
    s.users = Array.from(seen.values());
  }
  state = s;
  session.userId = userId;
  // Remember what Firestore holds, so saves only write what changed.
  const docs = buildDocs();
  lastSaved = {};
  Object.keys(docs).forEach(p=>{
    const exists = p==='league/meta' ? metaSnap.exists()
                 : p==='league/games' ? gamesSnap.exists()
                 : p==='league/roundups' ? roundSnap.exists()
                 : p.startsWith('players/') ? (playersLoaded || p==='players/'+userId)
                 : true;
    if(exists) lastSaved[p] = JSON.stringify(docs[p]);
  });
  // First-ever admin login: seed the league documents.
  if(myProfile.isAdmin && !metaSnap.exists()){
    refreshWindowTimestamps();
    await saveState();
  }
}

async function saveState(){
  if(!fbUser) throw new Error('Not signed in');
  const admin = !!(myProfile && myProfile.isAdmin);
  const docs = buildDocs();
  const writes = [], deletes = [];
  Object.keys(docs).forEach(path=>{
    if(!admin && !path.startsWith('entries/')) return;   // players may only touch entries
    const s = JSON.stringify(docs[path]);
    if(lastSaved[path] !== s) writes.push([path, docs[path], s]);
  });
  if(admin) Object.keys(lastSaved).forEach(path=>{ if(!(path in docs)) deletes.push(path); });
  try{
    let batch = writeBatch(db), n = 0;
    const flush = async ()=>{ if(n>0){ await batch.commit(); batch = writeBatch(db); n = 0; } };
    for(const [path, data] of writes){ batch.set(docRefFor(path), toFirestore(path, data)); n++; if(n>=400) await flush(); }
    for(const path of deletes){ batch.delete(docRefFor(path)); n++; if(n>=400) await flush(); }
    await flush();
    writes.forEach(([p,d,s])=>{ lastSaved[p] = s; });
    deletes.forEach(p=>{ delete lastSaved[p]; });
  }catch(e){
    const denied = e && (e.code==='permission-denied' || /permission/i.test(e.message||''));
    showMsg('error', denied
      ? 'The server rejected that change. If you were making a pick, the pick window may be closed (or not open yet).'
      : 'Could not save — please try again.');
    throw e; // stop the calling handler so it can't show a false "saved" message
  }
}

async function importBackup(obj){

function showMsg(type,text){ msg = {type,text}; render(); setTimeout(()=>{ msg=null; render(); }, 4000); }

// ---------- domain helpers ----------
function currentUser(){ return state.users.find(u=>u.id===session.userId) || null; }
function userEntries(userId){ return state.entries.filter(e=>e.userId===userId); }
function weekGames(week){ return state.games[week] || []; }
function teamsPlayingInWeek(week){
  const set = new Set();
  weekGames(week).forEach(g=>{ set.add(g.home); set.add(g.away); });
  return set;
}
function computeRecord(abbr){
  let w=0,l=0,t=0;
  Object.values(state.games).forEach(list=>list.forEach(g=>{
    if(g.status!=='final') return;
    if(g.home!==abbr && g.away!==abbr) return;
    const me = g.home===abbr ? g.homeScore : g.awayScore;
    const opp = g.home===abbr ? g.awayScore : g.homeScore;
    if(me>opp) w++; else if(me<opp) l++; else t++;
  }));
  return `${w}-${l}${t?'-'+t:''}`;
}
function gameResultForTeam(week, abbr){
  const g = weekGames(week).find(g=>g.home===abbr||g.away===abbr);
  if(!g || g.status!=='final') return null;
  const me = g.home===abbr ? g.homeScore : g.awayScore;
  const opp = g.home===abbr ? g.awayScore : g.homeScore;
  if(me>opp) return 'win'; if(me<opp) return 'loss'; return 'tie';
}
function teamScoreInWeek(week, abbr){
  const g = weekGames(week).find(g=>g.home===abbr||g.away===abbr);
  if(!g || g.status!=='final') return null;
  return g.home===abbr ? g.homeScore : g.awayScore;
}
function highScoreTeamOfWeek(week){
  let best=null, bestScore=-1;
  weekGames(week).forEach(g=>{
    if(g.status!=='final') return;
    if(g.homeScore>bestScore){ bestScore=g.homeScore; best=g.home; }
    if(g.awayScore>bestScore){ bestScore=g.awayScore; best=g.away; }
  });
  return best;
}
function usedTeams(entry){
  return Object.values(entry.picks||{}).map(p=>p.survivor).filter(Boolean);
}
// An entry counts as "alive" for display if it's actually alive, OR it was eliminated
// within the buy-back window and has already submitted a pick for a later buy-back
// week that hasn't been processed yet (a pending buy-back attempt).
function pendingBuyBackWeek(e){
  if(!e.eliminated || !e.eliminatedWeek || e.eliminatedWeek>=BUY_BACK_CUTOFF_WEEK) return null;
  for(let w=e.eliminatedWeek+1; w<=BUY_BACK_CUTOFF_WEEK; w++){
    if(e.picks[w] && e.picks[w].survivor) return w;
  }
  return null;
}
// Picks for the current week are closed once any of that week's games has started
// (by status, or by its kickoff time having passed).
function currentWeekPicksClosed(){
  const w = state.meta.currentWeek;
  const now = Date.now();
  return weekGames(w).some(g => g.status!=='scheduled' || (g.startTime && Date.parse(g.startTime) <= now));
}
// Alive for display: not eliminated AND (if this week's picks have closed) has a pick
// this week. Eliminated entries count as alive only with a pending buy-back pick.
function isDisplayAlive(e){
  if(e.eliminated) return pendingBuyBackWeek(e)!==null;
  if(currentWeekPicksClosed()){
    const p = e.picks[state.meta.currentWeek];
    if(!p || !p.survivor) return false;
  }
  return true;
}
// The week to show as an entry's elimination week (a missed pick counts as this week).
function displayEliminatedWeek(e){ return e.eliminated ? e.eliminatedWeek : state.meta.currentWeek; }

// Computes how many entries "count" each week:
// - Weeks 1 through the buy-back cutoff: the number of entries that submitted a survivor
//   pick that week (before wins/losses are applied) — since anyone can buy back in through
//   that window, a raw submission count is what "how many are playing" means here.
// - From the week after buy-back closes onward: the true number of surviving entries,
//   reconstructed via the same win/loss/buy-back simulation Process Week uses, since from
//   that point elimination is permanent and no longer a matter of who simply submitted.
function computeAliveByWeekSeries(){
  const maxWeek = state.meta.currentWeek;
  const alive = {};
  state.entries.forEach(e=>{ alive[e.id] = true; });
  const series = [];
  for(let w=1; w<=maxWeek; w++){
    const withinBuyBack = w<=BUY_BACK_CUTOFF_WEEK;
    state.entries.forEach(e=>{
      const wasAlive = alive[e.id];
      if(!wasAlive && !withinBuyBack) return; // permanently out
      const pick = e.picks[w];
      if(!pick || !pick.survivor){
        if(wasAlive) alive[e.id] = false;
        return;
      }
      const result = gameResultForTeam(w, pick.survivor);
      if(result==='loss') alive[e.id] = false;
      else if(result==='win' || result==='tie'){ if(!wasAlive) alive[e.id] = true; }
      // result === null (game not final yet) leaves status unchanged for this week.
    });
    const count = withinBuyBack
      ? state.entries.filter(e=>e.picks[w] && e.picks[w].survivor).length
      : Object.values(alive).filter(Boolean).length;
    series.push({ week: w, count });
  }
  return series;
}

// Re-simulates ONE entry's alive/eliminated status from Week 1 forward using the exact
// same win/loss/buy-back rules as Process Week. Call this after manually correcting a
// past week's pick so any downstream elimination status stays correct automatically.
function recalculateEntryStatus(entry){
  let alive = true, eliminatedWeek = null;
  for(let w=1; w<=state.meta.currentWeek; w++){
    const withinBuyBack = w<=BUY_BACK_CUTOFF_WEEK;
    if(!alive && !withinBuyBack) break; // permanently out — status locked from here on
    const pick = entry.picks[w];
    if(!pick || !pick.survivor){
      if(alive){ alive = false; eliminatedWeek = w; }
      continue;
    }
    const result = gameResultForTeam(w, pick.survivor);
    if(result==='loss'){ alive = false; eliminatedWeek = w; }
    else if(result==='win' || result==='tie'){ if(!alive){ alive = true; eliminatedWeek = null; } }
    // result === null (game not final yet) leaves status unchanged for this week.
  }
  entry.eliminated = !alive;
  entry.eliminatedWeek = alive ? null : eliminatedWeek;
}

// ---------- ET pick window (open/close) ----------
function nowInET(){ return new Date(new Date().toLocaleString('en-US', {timeZone:'America/New_York'})); }
const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function formatClock(h,m){
  let period = h>=12 ? 'pm' : 'am';
  let hh = h % 12; if(hh===0) hh = 12;
  return `${hh}:${String(m).padStart(2,'0')}${period}`;
}
// endOfMinute=true treats the target as inclusive through :59.999 of that minute (used for
// the close time, so "11:59pm" means picks are still allowed up through that whole minute).
function nextOccurrence(day, hour, minute, endOfMinute){
  const now = nowInET();
  const target = new Date(now);
  const curDay = target.getDay();
  let daysUntil = (day - curDay + 7) % 7;
  target.setDate(target.getDate() + daysUntil);
  target.setHours(hour, minute, endOfMinute?59:0, endOfMinute?999:0);
  if(target <= now){ target.setDate(target.getDate()+7); }
  return target;
}
function mostRecentOccurrence(day, hour, minute, endOfMinute){
  const now = nowInET();
  const target = new Date(now);
  const curDay = target.getDay();
  let daysSince = (curDay - day + 7) % 7;
  target.setDate(target.getDate() - daysSince);
  target.setHours(hour, minute, endOfMinute?59:0, endOfMinute?999:0);
  if(target > now){ target.setDate(target.getDate()-7); }
  return target;
}
function getOpenSettings(){
  return {
    day: state?.meta?.openDay ?? 1,
    hour: state?.meta?.openHour ?? 0,
    minute: state?.meta?.openMinute ?? 0
  };
}
function getCloseSettings(){
  return {
    day: state?.meta?.deadlineDay ?? 3,
    hour: state?.meta?.deadlineHour ?? 23,
    minute: state?.meta?.deadlineMinute ?? 59
  };
}
function nextOpenTime(){ const o = getOpenSettings(); return nextOccurrence(o.day, o.hour, o.minute, false); }
function nextCloseTime(){ const c = getCloseSettings(); return nextOccurrence(c.day, c.hour, c.minute, true); }
function isPickWindowOpen(){
  const o = getOpenSettings(), c = getCloseSettings();
  const lastOpen = mostRecentOccurrence(o.day, o.hour, o.minute, false);
  const lastClose = mostRecentOccurrence(c.day, c.hour, c.minute, true);
  return lastOpen > lastClose;
}
function updateDeadlineLabel(){
  const el = document.getElementById('deadline-label');
  if(!el || !state) return;
  const o = getOpenSettings(), c = getCloseSettings();
  if(isPickWindowOpen()){
    el.textContent = `Picks lock (${DAY_NAMES[c.day]} ${formatClock(c.hour,c.minute)} ET) in`;
  } else {
    el.textContent = `Picks open (${DAY_NAMES[o.day]} ${formatClock(o.hour,o.minute)} ET) in`;
  }
}

function tickCountdown(){
  const el = document.getElementById('countdown');
  if(!el) return;
  updateDeadlineLabel();
  const target = isPickWindowOpen() ? nextCloseTime() : nextOpenTime();
  const diff = target - nowInET();
  const d = Math.floor(diff/86400000);
  const h = Math.floor((diff%86400000)/3600000);
  const m = Math.floor((diff%3600000)/60000);
  const s = Math.floor((diff%60000)/1000);
  el.textContent = `${d}d ${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
}
setInterval(tickCountdown, 1000);

// ---------- ESPN fetch (with manual fallback) ----------
// ESPN uses different abbreviations for a few teams; normalize them to match the app.
const ESPN_ABBR_MAP = { WSH:'WAS', JAC:'JAX' };
function normalizeESPNAbbr(abbr){ return ESPN_ABBR_MAP[abbr] || abbr; }
function parseESPNScore(score){
  if(score === undefined || score === null || score === '') return null;
  const n = parseInt(score);
  return isNaN(n) ? null : n;
}
function mapESPNEvents(events, week){
  return events
    .filter(ev => ev.week && ev.week.number === Number(week))
    .map(ev => {
      const comp = ev.competitions[0];
      const home = comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors.find(c => c.homeAway === 'away');
      return {
        id: ev.id, week: Number(week),
        home: normalizeESPNAbbr(home.team.abbreviation),
        away: normalizeESPNAbbr(away.team.abbreviation),
        homeScore: parseESPNScore(home.score),
        awayScore: parseESPNScore(away.score),
        status: comp.status.type.completed ? 'final' : (comp.status.type.state === 'in' ? 'live' : 'scheduled'),
        startTime: ev.date
      };
    });
}
// Two strategies: (1) look up the week's exact date range from the season calendar,
// then fetch by date range — more precise; (2) direct week+seasontype query — simpler
// but ESPN sometimes returns the wrong week. Try (1) first, fall back to (2).
async function fetchWeekFromESPN(week){
  const toYMD = iso => iso.slice(0,10).replace(/-/g,'');
  // Strategy 1: calendar → date range
  try{
    const baseRes = await fetch('https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard');
    if(!baseRes.ok) throw new Error('base fetch failed');
    const baseData = await baseRes.json();
    const calendar = baseData.leagues?.[0]?.calendar || [];
    const regSeason = calendar.find(c => c.label === 'Regular Season');
    const weekEntry = regSeason && regSeason.entries.find(e => e.value === String(week));
    if(!weekEntry) throw new Error('week not found in calendar');
    const range = `${toYMD(weekEntry.startDate)}-${toYMD(weekEntry.endDate)}`;
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${range}&limit=1000`);
    if(!res.ok) throw new Error('range fetch failed');
    const data = await res.json();
    const games = mapESPNEvents(data.events || [], week);
    if(games.length > 0) return games;
    throw new Error('no games found in date range');
  }catch(_){}
  // Strategy 2: direct week query
  try{
    const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?seasontype=2&week=${week}&limit=100`);
    if(!res.ok) throw new Error('direct fetch failed');
    const data = await res.json();
    const games = mapESPNEvents(data.events || [], week);
    if(games.length > 0) return games;
  }catch(_){}
  return null;
}

      <p class="muted">Picks aren't open right now. They'll open <strong style="color:var(--text)">${DAY_NAMES[o.day]} ${formatClock(o.hour,o.minute)} ET</strong>.</p>
    </div>`;
  }
  if(!pickEntryId || !entries.find(e=>e.id===pickEntryId)) pickEntryId = entries[0].id;
  const entry = entries.find(e=>e.id===pickEntryId);
  const week = state.meta.currentWeek;
  const games = weekGames(week);
  const playing = teamsPlayingInWeek(week);
  const used = usedTeams(entry);
  const existingPick = entry.picks[week] || {};

  const survivorOptions = TEAMS_AZ.filter(t=>playing.has(t[0])).map(t=>{
    const disabled = used.includes(t[0]) && existingPick.survivor!==t[0];
    return `<option value="${t[0]}" ${disabled?'disabled':''} ${existingPick.survivor===t[0]?'selected':''}>${t[1]}${disabled?' — already used':''}</option>`;
  }).join('');
  const highScoreOptions = TEAMS_AZ.map(t=>`<option value="${t[0]}" ${existingPick.highscore===t[0]?'selected':''}>${t[1]}</option>`).join('');

  let entrySelector = '';
  if(entries.length>1){
    entrySelector = `<div class="field"><label>Picking for</label>
      <select id="entry-select">${entries.map(e=>`<option value="${e.id}" ${e.id===entry.id?'selected':''}>${e.label}${e.eliminated?' (eliminated)':''}</option>`).join('')}</select>
      </div>`;
  }

  let body = '';
  const canBuyBack = entry.eliminated && week<=BUY_BACK_CUTOFF_WEEK;
  if(games.length===0){
    body = `<p class="muted">Games for Week ${week} haven't been loaded yet. Check back once your commissioner posts the schedule.</p>`;
  } else if(entry.eliminated && !canBuyBack){
    body = `<p><span class="badge-out">OUT since Week ${entry.eliminatedWeek}</span></p>
      <p class="muted">This entry is eliminated from Survivor, but you can still play the High Score side game each week.</p>
      <div class="field"><label>Week ${week} — Team you think scores the most points</label>
      <select id="highscore-select">${highScoreOptions}</select></div>
      <button class="btn" id="save-picks">Save Pick</button>`;
  } else if(canBuyBack){
    body = `<p><span class="badge-out">OUT since Week ${entry.eliminatedWeek}</span></p>
      <p class="muted">Buy-back is open through Week ${BUY_BACK_CUTOFF_WEEK}: pick a winner this week and you're back in Survivor.</p>
      <div class="field"><label>Week ${week} — Team to win (buy back in)</label>
      <select id="survivor-select"><option value="">Select a team...</option>${survivorOptions}</select></div>
      <div class="field"><label>Week ${week} — High Score side game: team you think scores the most points</label>
      <select id="highscore-select">${highScoreOptions}</select></div>
      <button class="btn" id="save-picks">Save Picks</button>
      ${existingPick.survivor ? `<p class="muted" style="margin-top:10px;">Currently locked in: <strong style="color:var(--text)">${TEAM_MAP[existingPick.survivor]?.name}</strong> to win.</p>` : ''}`;
  } else {
    body = `
      <div class="field"><label>Week ${week} — Team to win</label>
      <select id="survivor-select"><option value="">Select a team...</option>${survivorOptions}</select></div>
      <div class="field"><label>Week ${week} — High Score side game: team you think scores the most points</label>
      <select id="highscore-select">${highScoreOptions}</select></div>
      <button class="btn" id="save-picks">Save Picks</button>
      ${existingPick.survivor ? `<p class="muted" style="margin-top:10px;">Currently locked in: <strong style="color:var(--text)">${TEAM_MAP[existingPick.survivor]?.name}</strong> to win.</p>` : ''}
    `;
  }

  return `<div class="card">
    <h2 style="margin-top:0;">Make Your Picks</h2>
    ${entrySelector}
    ${body}
  </div>`;
}

// ---------- STANDINGS ----------
function renderStandings(){
  function ownerName(e){ const u = state.users.find(u=>u.id===e.userId); return u ? u.displayName : '—'; }

  // Group entries by owner within each section so a user's entries sit together,
  // unless that user has entries split across both active and eliminated.
  function groupAndSort(entries, sortKeyFn){
    const byOwner = {};
    entries.forEach(e=>{ (byOwner[e.userId] = byOwner[e.userId] || []).push(e); });
    const groups = Object.values(byOwner).map(list=>{
      list.sort((a,b)=>a.label.localeCompare(b.label));
      return { key: sortKeyFn(list), list };
    });
    groups.sort((a,b)=> a.key.localeCompare ? a.key.localeCompare(b.key) : a.key-b.key);
    return groups.flatMap(g=>g.list);
  }

  const active = groupAndSort(
    state.entries.filter(e=>isDisplayAlive(e)),
    list => ownerName(list[0])
  );
  const out = groupAndSort(
    state.entries.filter(e=>!isDisplayAlive(e)),
    list => -Math.max(...list.map(e=>displayEliminatedWeek(e)||0))
  );
  // For eliminated entries, history stops at the week they went out (that week is always
  // listed, so a missed pick shows as a blank chip). Past weeks are colored green (win)
  // or red (loss); current week picks are neutral.
  function pickHistory(e, lastWeek){
    let weeks = Object.keys(e.picks).map(Number);
    if(lastWeek){
      weeks = weeks.filter(w => w <= lastWeek);
      if(!weeks.includes(lastWeek)) weeks.push(lastWeek);
    }
    weeks.sort((a, b) => a - b);
    if(weeks.length === 0) return '<span style="color:var(--muted)">—</span>';
    const chips = weeks.map(w => {
      const abbr = (e.picks[w] && e.picks[w].survivor) || null;
      let color = 'var(--muted)';
      if(abbr){
        if(w < state.meta.currentWeek){
          const result = gameResultForTeam(w, abbr);
          if(result === 'win') color = 'var(--turf)';
          else if(result === 'loss') color = 'var(--danger)';
          else color = 'var(--text)';
        } else {
          color = 'var(--text)';
        }
      }
      return `<div style="display:inline-flex;flex-direction:column;align-items:center;padding:2px 5px;min-width:30px;text-align:center;">` +
        `<span style="font-size:9px;color:var(--muted);line-height:1.4;">${w}</span>` +
        `<span style="font-size:12px;font-weight:700;color:${color};line-height:1.3;">${abbr || '—'}</span>` +
        `</div>`;
    }).join('');
    return `<div style="display:inline-flex;min-width:max-content;">${chips}</div>`;
  }

  let rows = active.map(e=>{
    const pendingWeek = pendingBuyBackWeek(e);
    return `
    <tr>
      <td class="name" style="position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:2px 0 0 var(--line);">${ownerName(e)}</td>
      <td class="muted">${e.label}</td>
      <td>${pickHistory(e)}</td>
      <td style="color:var(--accent);font-weight:700;">Alive${pendingWeek?` <span class="muted" style="font-weight:400;font-size:12px;">(buy-back pending, Wk ${pendingWeek})</span>`:''}</td>
    </tr>`;
  }).join('');
  rows += out.map(e=>`
    <tr class="eliminated-row">
      <td class="name" style="position:sticky;left:0;background:var(--surface-2);z-index:2;box-shadow:2px 0 0 var(--line);">${ownerName(e)}</td>
      <td>${e.label}</td>
      <td>${pickHistory(e, displayEliminatedWeek(e))}</td>
      <td>Out — Week ${displayEliminatedWeek(e)}</td>
    </tr>`).join('');

  const hsTotals = state.entries.map(e=>{
    let total = 0, pending = 0;
    Object.entries(e.picks).forEach(([w,p])=>{
      if(!p.highscore) return;
      const wNum = Number(w);
      if(weekGames(wNum).length===0) return; // no games loaded for that week at all
      const score = teamScoreInWeek(wNum, p.highscore);
      if(score!==null) total += score; else pending++;
    });
    return { entry: e, owner: ownerName(e), total, pending };
  }).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);
  const hsRows = hsTotals.map(x=>`<tr><td>${x.owner}</td><td class="muted">${x.entry.label}</td><td style="color:var(--accent);font-weight:700;">${x.total}${x.pending?` <span class="muted" style="font-weight:400;font-size:12px;">(${x.pending} pending)</span>`:''}</td></tr>`).join('');

  return `
  <div class="card">
    <h2 style="margin-top:0;">Season Standings</h2>
    ${state.entries.length===0 ? '<p class="empty">No entries yet.</p>' : `
    <div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">
    <table style="min-width:500px;">
      <thead><tr>
        <th style="position:sticky;left:0;background:var(--surface);z-index:2;box-shadow:2px 0 0 var(--line);">Owner</th>
        <th>Entry</th><th>Picks</th><th>Status</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>`}
  </div>
  <div class="card">
    <h3 style="margin-top:0;">High Score Challenge</h3>
    <p class="muted" style="font-size:13px;margin-top:0;">Total points scored by each entry's picked team, added up across the season.</p>
    ${hsRows ? `<table><thead><tr><th>Owner</th><th>Entry</th><th>Total Points</th></tr></thead><tbody>${hsRows}</tbody></table>` : '<p class="empty">No points yet.</p>'}
  </div>`;
}

// ---------- LEAGUE STATS ----------
function renderLeagueStats(){
  if(statsWeekSelected===null) statsWeekSelected = state.meta.currentWeek;
  const totalEntries = state.entries.length;
  const aliveCount = state.entries.filter(e=>isDisplayAlive(e)).length;
  const outCount = totalEntries - aliveCount;

  // Pick popularity across the whole season, with win/loss record for each team as a pick.
  const pickStats = {}; // abbr -> {picks, wins, losses, pending}
  state.entries.forEach(e=>{
    Object.entries(e.picks).forEach(([w,p])=>{
      if(!p.survivor) return;
      const abbr = p.survivor;
      if(!pickStats[abbr]) pickStats[abbr] = {picks:0, wins:0, losses:0, pending:0};
      pickStats[abbr].picks++;
      const result = gameResultForTeam(Number(w), abbr);
      if(result==='win' || result==='tie') pickStats[abbr].wins++;
      else if(result==='loss') pickStats[abbr].losses++;
      else pickStats[abbr].pending++;
    });
  });
  const totalPicks = Object.values(pickStats).reduce((sum,s)=>sum+s.picks,0);
  const pickRows = Object.entries(pickStats)
    .sort((a,b)=>b[1].picks-a[1].picks)
    .map(([abbr,s])=>{
      const pct = totalPicks ? ((s.picks/totalPicks)*100).toFixed(1) : '0.0';
      return `<tr><td>${TEAM_MAP[abbr]?.name||abbr}</td><td style="font-weight:700;">${s.picks}</td><td class="muted">${pct}%</td><td class="muted">${s.wins}-${s.losses}${s.pending?` (${s.pending} pending)`:''}</td></tr>`;
    })
    .join('');

  // Eliminations by week (net, i.e. after accounting for buy-back revivals — based on current eliminatedWeek).
  const elimByWeek = {};
  state.entries.forEach(e=>{ if(e.eliminated && e.eliminatedWeek){ elimByWeek[e.eliminatedWeek] = (elimByWeek[e.eliminatedWeek]||0)+1; } });
  const elimWeeks = Object.keys(elimByWeek).map(Number).sort((a,b)=>a-b);
  const elimRows = elimWeeks.map(w=>{
    const pct = totalEntries ? ((elimByWeek[w]/totalEntries)*100).toFixed(1) : '0.0';
    return `<tr><td>Week ${w}</td><td style="font-weight:700;">${elimByWeek[w]}</td><td class="muted">${pct}% of all entries</td></tr>`;
  }).join('');

  // Pick popularity for a single selected week.
  const wkPickStats = {}; // abbr -> count
  state.entries.forEach(e=>{
    const pick = e.picks[statsWeekSelected] && e.picks[statsWeekSelected].survivor;
    if(!pick) return;
    wkPickStats[pick] = (wkPickStats[pick]||0)+1;
  });
  const totalWkPicks = Object.values(wkPickStats).reduce((sum,n)=>sum+n,0);
  const wkWeekOptions = Array.from({length:18},(_,i)=>i+1).map(w=>`<option value="${w}" ${w===statsWeekSelected?'selected':''}>Week ${w}</option>`).join('');
  const wkPickRows = Object.entries(wkPickStats)
    .sort((a,b)=>b[1]-a[1])
    .map(([abbr,count])=>{
      const pct = totalWkPicks ? ((count/totalWkPicks)*100).toFixed(1) : '0.0';
      const result = gameResultForTeam(statsWeekSelected, abbr);
      const resultLabel = result==='win'?'Won':result==='loss'?'Lost':result==='tie'?'Tied':'Pending';
      return `<tr><td>${TEAM_MAP[abbr]?.name||abbr}</td><td style="font-weight:700;">${count}</td><td class="muted">${pct}%</td><td class="muted">${resultLabel}</td></tr>`;
    })
    .join('');

  return `
  <div class="card card-accent">
    <h2 style="margin-top:0;">League Stats</h2>
    <p class="muted" style="margin:0;">${totalEntries} total entries · <strong style="color:var(--accent)">${aliveCount}</strong> alive · <strong style="color:var(--danger)">${outCount}</strong> out</p>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Pick Popularity (season)</h3>
    ${pickRows ? `<table><thead><tr><th>Team</th><th>Times Picked</th><th>% of All Picks</th><th>Record when picked</th></tr></thead><tbody>${pickRows}</tbody></table>` : '<p class="empty">No picks recorded yet.</p>'}
  </div>
  <div class="card">
    <div class="row">
      <h3 style="margin:0;">Pick Popularity by Week</h3>
      <select id="stats-week-select" style="width:auto;">${wkWeekOptions}</select>
    </div>
    <div class="hr"></div>
    ${wkPickRows ? `<table><thead><tr><th>Team</th><th>Times Picked</th><th>% of Week's Picks</th><th>Result</th></tr></thead><tbody>${wkPickRows}</tbody></table>` : '<p class="empty">No picks recorded for this week yet.</p>'}
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Eliminations by Week</h3>
    ${elimRows ? `<table><thead><tr><th>Week</th><th>Entries Out</th><th>% of All Entries</th></tr></thead><tbody>${elimRows}</tbody></table>` : '<p class="empty">No eliminations yet.</p>'}
  </div>`;
}

        <option value="scheduled" ${g.status==='scheduled'?'selected':''}>Scheduled</option>
        <option value="live" ${g.status==='live'?'selected':''}>Live</option>
        <option value="final" ${g.status==='final'?'selected':''}>Final</option>
      </select></td>
      <td><input type="number" data-gidx="${i}" class="away-score" value="${g.awayScore??''}" style="width:60px;"></td>
      <td><input type="number" data-gidx="${i}" class="home-score" value="${g.homeScore??''}" style="width:60px;"></td>
      <td><button class="btn-outline" data-remove="${i}">Remove</button></td>
    </tr>`).join('');

  // Correct a Pick tool
  const sortedUsers = [...state.users].sort((a,b)=>a.displayName.localeCompare(b.displayName));
  if(!correctPickUserId && sortedUsers.length) correctPickUserId = sortedUsers[0].id;
  const cpEntries = userEntries(correctPickUserId);
  if(!correctPickEntryId || !cpEntries.find(e=>e.id===correctPickEntryId)) correctPickEntryId = cpEntries[0] ? cpEntries[0].id : null;
  if(!correctPickWeek) correctPickWeek = adminWeek;
  const cpEntry = state.entries.find(e=>e.id===correctPickEntryId);
  const cpExisting = (cpEntry && cpEntry.picks[correctPickWeek]) || {};
  const cpUserOptions = sortedUsers.map(u=>`<option value="${u.id}" ${u.id===correctPickUserId?'selected':''}>${u.displayName}</option>`).join('');
  const cpEntryOptions = cpEntries.map(e=>`<option value="${e.id}" ${e.id===correctPickEntryId?'selected':''}>${e.label}${e.eliminated?' [out wk '+e.eliminatedWeek+']':''}</option>`).join('');
  const cpWeekOptions = Array.from({length:18},(_,i)=>i+1).map(w=>`<option value="${w}" ${w===correctPickWeek?'selected':''}>Week ${w}</option>`).join('');
  const cpTeamOptions = (selected) => `<option value="">No pick</option>` + TEAMS_AZ.map(t=>`<option value="${t[0]}" ${selected===t[0]?'selected':''}>${t[1]}</option>`).join('');
  const correctPickBlock = sortedUsers.length ? `
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="field"><label>Owner</label><select id="cp-user-select">${cpUserOptions}</select></div>
      <div class="field"><label>Entry</label><select id="cp-entry-select">${cpEntryOptions}</select></div>
    </div>
    <div class="field"><label>Week</label><select id="cp-week-select" style="width:auto;">${cpWeekOptions}</select></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="field"><label>Survivor pick</label><select id="cp-survivor-select">${cpTeamOptions(cpExisting.survivor)}</select></div>
      <div class="field"><label>High Score pick</label><select id="cp-highscore-select">${cpTeamOptions(cpExisting.highscore)}</select></div>
    </div>
    <button class="btn" id="cp-save">Save Correction</button>
  ` : '<p class="empty">No users yet.</p>';

  const usersList = state.users.map(u=>{
    const ents = userEntries(u.id);
    const isConfirming = confirmingRemoveUserId===u.id;
    return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);">
      <div><strong>${u.displayName}</strong> <span class="muted">${u.isAdmin?'· admin':''}${u.pending?' · login not created yet':''}</span><br>
      <span class="muted" style="font-size:12px;">${ents.map(e=>e.label+(e.eliminated?' [out]':'')).join(', ')||'no entries'}</span></div>
      <div>
        ${isConfirming ? `
          <span style="color:var(--danger);font-size:13px;margin-right:8px;">Remove ${u.displayName} and ${ents.length} entr${ents.length===1?'y':'ies'}?</span>
          <button class="btn-danger" style="border:none;border-radius:4px;padding:9px 14px;font-size:13px;font-weight:600;" data-confirm-remove-user="${u.id}">Yes, remove</button>
          <button class="btn-outline" data-cancel-remove-user="${u.id}">Cancel</button>
        ` : `
          <button class="btn-outline" data-add-entry="${u.id}">Add entry</button> ${!u.isAdmin?`<button class="btn-outline" data-make-admin="${u.id}">Make Admin</button>`:''} <button class="btn-outline" data-remove-user="${u.id}" style="border-color:var(--danger);color:var(--danger);">Remove User</button>
        `}
      </div>
    </div>`;
  }).join('');

  const openDayOptions = DAY_NAMES.map((n,i)=>`<option value="${i}" ${i===(state.meta.openDay??1)?'selected':''}>${n}</option>`).join('');
  const curOpenH = state.meta.openHour ?? 0;
  const curOpenM = state.meta.openMinute ?? 0;
  const openTimeVal = `${String(curOpenH).padStart(2,'0')}:${String(curOpenM).padStart(2,'0')}`;

  const dayOptions = DAY_NAMES.map((n,i)=>`<option value="${i}" ${i===(state.meta.deadlineDay??3)?'selected':''}>${n}</option>`).join('');
  const curDeadlineH = state.meta.deadlineHour ?? 23;
  const curDeadlineM = state.meta.deadlineMinute ?? 59;
  const deadlineTimeVal = `${String(curDeadlineH).padStart(2,'0')}:${String(curDeadlineM).padStart(2,'0')}`;

  return `
  <div class="card">
    <h2 style="margin-top:0;">Admin — Pick Window</h2>
    <p class="muted" style="font-size:13px;">Picks can only be submitted between these two points each week (Eastern Time). The countdown banner and label update automatically once saved, and the Make Picks page enforces this for real — not just as a display.</p>
    <h3 style="margin-bottom:6px;">Opens</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="field"><label>Day of week</label><select id="open-day-select">${openDayOptions}</select></div>
      <div class="field"><label>Time (ET)</label><input type="time" id="open-time-input" value="${openTimeVal}"></div>
    </div>
    <h3 style="margin-bottom:6px;">Closes</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="field"><label>Day of week</label><select id="deadline-day-select">${dayOptions}</select></div>
      <div class="field"><label>Time (ET)</label><input type="time" id="deadline-time-input" value="${deadlineTimeVal}"></div>
    </div>
    <button class="btn" id="save-deadline">Save Pick Window</button>
  </div>
  <div class="card">
    <h2 style="margin-top:0;">Admin — Games</h2>
    <div class="row"><div></div><select id="admin-week-select" style="width:auto;">${weekOptions}</select></div>
    <div class="hr"></div>
    <button class="btn-outline" id="fetch-espn">Fetch Week ${week} from ESPN</button>
    <button class="btn-outline" id="load-schedule">Load full season schedule</button>
    ${staged}
    <div class="hr"></div>
    <h3>Paste results (from Claude)</h3>
    <p class="muted" style="font-size:13px;">If the automatic fetch doesn't work, ask Claude to pull this week's scores and paste the JSON it gives you here. It'll be staged for review below, just like a successful fetch.</p>
    <textarea id="paste-results-json" rows="6" style="width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px;font-family:monospace;font-size:12px;" placeholder='[{"id":"...", "week":${week}, "away":"NE", "home":"SEA", "awayScore":10, "homeScore":13, "status":"final", "startTime":"..."}, ...]'></textarea>
    <button class="btn-outline" id="paste-results-btn" style="margin-top:10px;">Stage Pasted Results</button>
    <div class="hr"></div>
    ${gameRows ? `<table><thead><tr><th>Matchup</th><th>Status</th><th>Away</th><th>Home</th><th></th></tr></thead><tbody>${gameRows}</tbody></table>
      <button class="btn" id="save-score-edits" style="margin-top:10px;">Save score edits</button>` : '<p class="muted">No games yet for this week.</p>'}
    <div class="hr"></div>
    <h3>Add game manually</h3>
    <div class="grid" style="grid-template-columns:1fr 1fr;">
      <div class="field"><label>Away team</label><select id="manual-away">${teamOptions}</select></div>
      <div class="field"><label>Home team</label><select id="manual-home">${teamOptions}</select></div>
    </div>
    <button class="btn-outline" id="add-manual-game">Add Game</button>
    <div class="hr"></div>
    <div class="row">
      <div>
        <strong>Process Week ${week}</strong>
        <p class="muted" style="margin:4px 0 0;font-size:13px;">Eliminates any active entry whose survivor pick lost (or who didn't pick). Run this after all Week ${week} games are marked Final.
        ${week<=BUY_BACK_CUTOFF_WEEK ? ` Buy-back is open through Week ${BUY_BACK_CUTOFF_WEEK}: an already-eliminated entry with a winning pick this week is automatically revived.` : ` Buy-back has closed (it only applied through Week ${BUY_BACK_CUTOFF_WEEK}) — eliminations from here on are final.`}</p>
      </div>
      <button class="btn" id="process-week">Process Week ${week}</button>
    </div>
    <div class="hr"></div>
    <div class="row">
      <span>Current league week: <strong>${state.meta.currentWeek}</strong></span>
      <button class="btn-outline" id="advance-week">Advance to Week ${state.meta.currentWeek+1}</button>
    </div>
  </div>
  <div class="card">
    <h2 style="margin-top:0;">Admin — Correct a Pick</h2>
    <p class="muted" style="font-size:13px;">Fix a single entry's pick for any week. Saving automatically re-checks that entry's alive/eliminated status from Week 1 forward, so a corrected pick can revive or eliminate them as appropriate.</p>
    ${correctPickBlock}
  </div>
  <div class="card">
    <h2 style="margin-top:0;">Admin — Users &amp; Entries</h2>
    ${usersList || '<p class="empty">No users yet.</p>'}
    <div class="hr"></div>
    <button class="btn" id="create-accounts-btn">Create player logins (${state.users.filter(u=>u.pending).length} pending)</button>
    <p class="muted" style="font-size:12px;margin:6px 0 0;">Gives each pending player a login. Starting password = their display name; they must change it the first time they log in.</p>
    <div id="create-progress" class="muted" style="margin-top:8px;font-size:13px;"></div>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Import roster &amp; Week ${week} picks</h3>
    <p class="muted" style="font-size:13px;">Paste rows of <code>Name&nbsp;&nbsp;Team</code> (tab, or comma, separated — pasting straight from a spreadsheet works). If a person has multiple entries, add a number at the end of their name for each row (e.g. "Alex Wynn 1", "Alex Wynn 2") — those will be grouped under one login with an entry each. People with no number get a single "Entry 1". New people are added as pending players — use “Create player logins” above to give them a login. Existing people (matched by name) just get this week's pick recorded on the right entry.</p>
    <div class="field"><label>Pick type</label>
      <select id="roster-import-type">
        <option value="survivor">Survivor pick (team to win)</option>
        <option value="highscore">High Score side game (team to score the most)</option>
      </select>
    </div>
    <textarea id="roster-csv" rows="10" style="width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px;font-family:monospace;font-size:13px;" placeholder="Adam Consiglio	LA CHARGERS
Alex Wynn 1	JACKSONVILLE
Alex Wynn 2	CHICAGO"></textarea>
    <button class="btn" id="roster-import" style="margin-top:10px;">Import for Week ${week}</button>
  </div>
  <div class="card">
    <h3 style="margin-top:0;">Import league backup (JSON)</h3>
    <p class="muted" style="font-size:13px;">One-time migration: choose a league-data-backup.json file. Players are added as pending and their logins are created automatically (this can take a minute or two). Entries with the same ID are overwritten, so don't use this once the season is live.</p>
    <input type="file" id="backup-file" accept=".json,application/json">
    <button class="btn" id="import-backup-btn" style="margin-top:10px;">Import backup &amp; create logins</button>
    <div id="import-progress" class="muted" style="margin-top:8px;font-size:13px;"></div>
  </div>`;
}

// ---------- event handlers ----------
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', (e)=>{ e.preventDefault(); setTab(el.dataset.nav); }));

  // Picks tab
  const entrySelect = document.getElementById('entry-select');
  if(entrySelect) entrySelect.addEventListener('change', ()=>{ pickEntryId = entrySelect.value; render(); });
  const savePicksBtn = document.getElementById('save-picks');
  if(savePicksBtn) savePicksBtn.addEventListener('click', async ()=>{
    if(!isPickWindowOpen()){ showMsg('error','Picks are closed right now.'); render(); return; }
    const user = currentUser();
    const entry = state.entries.find(e=>e.id===pickEntryId);
    const week = state.meta.currentWeek;
    const survivorEl = document.getElementById('survivor-select');
    const hsEl = document.getElementById('highscore-select');
    if(!entry.picks[week]) entry.picks[week] = {};
    if(survivorEl){
      if(!survivorEl.value){ showMsg('error','Pick a team to win before saving.'); return; }
      entry.picks[week].survivor = survivorEl.value;
    }
    if(hsEl) entry.picks[week].highscore = hsEl.value;
    await saveState();
    showMsg('ok','Picks saved.');
  });

  // Games tab
  const gwSel = document.getElementById('games-week-select');
  if(gwSel) gwSel.addEventListener('change', ()=>{ gamesWeekSelected = Number(gwSel.value); render(); });

  // League Stats tab
  const statsWkSel = document.getElementById('stats-week-select');
  if(statsWkSel) statsWkSel.addEventListener('change', ()=>{ statsWeekSelected = Number(statsWkSel.value); render(); });

  // Weekly Recap tab
  const postRoundupBtn = document.getElementById('post-roundup');
  if(postRoundupBtn) postRoundupBtn.addEventListener('click', async ()=>{
    const textEl = document.getElementById('roundup-text');
    const text = textEl.value.trim();
    if(!text){ showMsg('error','Write something before posting.'); return; }
    const user = currentUser();
    if(!state.roundupPosts) state.roundupPosts = [];
    state.roundupPosts.push({
      id: uid('rp'), week: state.meta.currentWeek, authorName: user.displayName,
      timestamp: Date.now(), text
    });
    await saveState();
    showMsg('ok','Recap posted.');
  });
  document.querySelectorAll('[data-edit-roundup]').forEach(btn=>btn.addEventListener('click', ()=>{
    editingRoundupId = btn.dataset.editRoundup;
    confirmingDeleteRoundupId = null;
    render();
  }));
  document.querySelectorAll('[data-cancel-edit-roundup]').forEach(btn=>btn.addEventListener('click', ()=>{
    editingRoundupId = null;
    render();
  }));
  document.querySelectorAll('[data-save-roundup]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const postId = btn.dataset.saveRoundup;
    const newText = document.getElementById('edit-roundup-text-'+postId).value.trim();
    if(!newText){ showMsg('error','Recap text can\'t be empty.'); return; }
    const post = state.roundupPosts.find(p=>p.id===postId);
    if(post) post.text = newText;
    editingRoundupId = null;
    await saveState();
    showMsg('ok','Recap updated.');
  }));
  document.querySelectorAll('[data-delete-roundup]').forEach(btn=>btn.addEventListener('click', ()=>{
    confirmingDeleteRoundupId = btn.dataset.deleteRoundup;
    render();
  }));
  document.querySelectorAll('[data-cancel-delete-roundup]').forEach(btn=>btn.addEventListener('click', ()=>{
    confirmingDeleteRoundupId = null;
    render();
  }));
  document.querySelectorAll('[data-confirm-delete-roundup]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const postId = btn.dataset.confirmDeleteRoundup;
    state.roundupPosts = state.roundupPosts.filter(p=>p.id!==postId);
    confirmingDeleteRoundupId = null;
    await saveState();
    showMsg('ok','Recap deleted.');
  }));

  // Account tab
  const authSubmit = document.getElementById('auth-submit');
  if(authSubmit){
    const doLogin = async ()=>{
      const name = document.getElementById('auth-display').value.trim();
      const pw = document.getElementById('auth-password').value;
      if(!name || !pw){ showMsg('error','Enter your display name and password.'); return; }
      authSubmit.disabled = true;
      try{ await signInWithEmailAndPassword(auth, nameToEmail(name), pw); }
      catch(e){ showMsg('error', friendlyAuthError(e)); }
    };
    authSubmit.addEventListener('click', doLogin);
    const pwEl = document.getElementById('auth-password');
    if(pwEl) pwEl.addEventListener('keydown', ev=>{ if(ev.key==='Enter') doLogin(); });
  }
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{ await signOut(auth); });
  const forcePwBtn = document.getElementById('force-pw-btn');
  if(forcePwBtn) forcePwBtn.addEventListener('click', async ()=>{
    const a = document.getElementById('fp-new').value, b = document.getElementById('fp-new2').value;
    if(a.length < 6){ showMsg('error','Password must be at least 6 characters.'); return; }
    if(a !== b){ showMsg('error','The two passwords don\'t match.'); return; }
    if(a === startingPassword(myProfile.displayName)){ showMsg('error','Please choose a different password than your starting one.'); return; }
    try{
      await updatePassword(fbUser, a);
      await updateDoc(doc(db,'players',fbUser.uid), { mustChange: false });
      myProfile.mustChange = false;
      const me = state.users.find(u=>u.id===fbUser.uid); if(me) me.mustChange = false;
      const pd = buildDocs()['players/'+fbUser.uid]; if(pd) lastSaved['players/'+fbUser.uid] = JSON.stringify(pd);
      activeTab = 'home';
      showMsg('ok','Password saved. Welcome!');
    }catch(e){ showMsg('error', friendlyAuthError(e)); }
  });
  const changePwBtn = document.getElementById('change-pw-btn');
  if(changePwBtn) changePwBtn.addEventListener('click', async ()=>{
    const cur = document.getElementById('cp-current').value;
    const a = document.getElementById('cp-new').value, b = document.getElementById('cp-new2').value;
    if(a.length < 6){ showMsg('error','New password must be at least 6 characters.'); return; }
    if(a !== b){ showMsg('error','The two new passwords don\'t match.'); return; }
    try{
      await reauthenticateWithCredential(fbUser, EmailAuthProvider.credential(fbUser.email, cur));
      await updatePassword(fbUser, a);
      showMsg('ok','Password changed.');
    }catch(e){ showMsg('error', friendlyAuthError(e)); }
  });

  // Admin tab
  const saveDeadlineBtn = document.getElementById('save-deadline');
  if(saveDeadlineBtn) saveDeadlineBtn.addEventListener('click', async ()=>{
    const openDaySelectEl = document.getElementById('open-day-select');
    const closeDaySelectEl = document.getElementById('deadline-day-select');
    const openDay = Number(openDaySelectEl.value);
    const openTimeVal = document.getElementById('open-time-input').value;
    const closeDay = Number(closeDaySelectEl.value);
    const closeTimeVal = document.getElementById('deadline-time-input').value;
    if(!openTimeVal || !closeTimeVal){ showMsg('error','Pick both an open and close time.'); return; }
    const [oh,om] = openTimeVal.split(':').map(Number);
    const [ch,cm] = closeTimeVal.split(':').map(Number);
    state.meta.openDay = openDay;
    state.meta.openHour = oh;
    state.meta.openMinute = om;
    state.meta.deadlineDay = closeDay;
    state.meta.deadlineHour = ch;
    state.meta.deadlineMinute = cm;
    refreshWindowTimestamps();
    await saveState();
    updateDeadlineLabel();
    showMsg('ok', `Pick window updated: opens ${DAY_NAMES[openDay]} ${formatClock(oh,om)} ET, closes ${DAY_NAMES[closeDay]} ${formatClock(ch,cm)} ET.`);
  });
  const awSel = document.getElementById('admin-week-select');
  if(awSel) awSel.addEventListener('change', ()=>{ adminWeek = Number(awSel.value); stagedGames=null; render(); });
  const fetchBtn = document.getElementById('fetch-espn');
  if(fetchBtn) fetchBtn.addEventListener('click', async ()=>{
    fetchBtn.textContent = 'Fetching...';
    const result = await fetchWeekFromESPN(adminWeek);
    if(result===null || result.length===0){
      showMsg('error','Could not reach ESPN\'s data automatically. Try "Load full season schedule" instead, or add games manually below.');
    } else {
      stagedGames = result;
      render();
    }
  });
  const pasteResultsBtn = document.getElementById('paste-results-btn');
  if(pasteResultsBtn) pasteResultsBtn.addEventListener('click', ()=>{
    const raw = document.getElementById('paste-results-json').value.trim();
    if(!raw){ showMsg('error','Paste the JSON Claude gave you first.'); return; }
    try{
      const parsed = JSON.parse(raw);
      if(!Array.isArray(parsed) || parsed.length===0) throw new Error('not a non-empty array');
      const normalized = parsed.map(g=>({
        id: g.id || uid('g'),
        week: Number(adminWeek),
        home: g.home, away: g.away,
        homeScore: g.homeScore ?? null, awayScore: g.awayScore ?? null,
        status: g.status || 'scheduled',
        startTime: g.startTime ?? null
      }));
      stagedGames = normalized;
      showMsg('ok', `Staged ${normalized.length} game(s) for review below.`);
    }catch(e){
      showMsg('error','That doesn\'t look like valid JSON — paste exactly what Claude gave you, including the [ ] brackets.');
    }
  });
  const loadScheduleBtn = document.getElementById('load-schedule');
  if(loadScheduleBtn) loadScheduleBtn.addEventListener('click', async ()=>{
    let filled = 0;
    for(let w=1; w<=18; w++){
      if(!state.games[w] || state.games[w].length===0){
        state.games[w] = buildScheduleGames(w);
        filled++;
      }
    }
    await saveState();
    showMsg('ok', filled>0 ? `Loaded matchups for ${filled} week(s). Weeks that already had games were left as-is.` : 'All weeks already have games loaded.');
  });
  const confirmStaged = document.getElementById('confirm-staged');
  if(confirmStaged) confirmStaged.addEventListener('click', async ()=>{
    const existing = state.games[adminWeek] || [];
    const merged = [...existing];
    stagedGames.forEach(sg=>{
      const idx = merged.findIndex(g=>g.home===sg.home && g.away===sg.away);
      if(idx>=0) merged[idx] = { ...merged[idx], ...sg, id: merged[idx].id };
      else merged.push(sg);
    });
    state.games[adminWeek] = merged;
    stagedGames = null;
    await saveState();
    showMsg('ok','Week '+adminWeek+' games saved.');
  });
  const discardStaged = document.getElementById('discard-staged');
  if(discardStaged) discardStaged.addEventListener('click', ()=>{ stagedGames=null; render(); });
  const addManual = document.getElementById('add-manual-game');
  if(addManual) addManual.addEventListener('click', async ()=>{
    const away = document.getElementById('manual-away').value;
    const home = document.getElementById('manual-home').value;
    if(away===home){ showMsg('error','Home and away team must differ.'); return; }
    if(!state.games[adminWeek]) state.games[adminWeek] = [];
    state.games[adminWeek].push({ id: uid('g'), week: adminWeek, home, away, homeScore:null, awayScore:null, status:'scheduled', startTime:null });
    await saveState();
    showMsg('ok','Game added.');
  });
  const saveScoreEdits = document.getElementById('save-score-edits');
  if(saveScoreEdits) saveScoreEdits.addEventListener('click', async ()=>{
    const list = state.games[adminWeek];
    document.querySelectorAll('.status-select').forEach(el=>{ list[Number(el.dataset.gidx)].status = el.value; });
    document.querySelectorAll('.away-score').forEach(el=>{ list[Number(el.dataset.gidx)].awayScore = el.value===''?null:parseInt(el.value); });
    document.querySelectorAll('.home-score').forEach(el=>{ list[Number(el.dataset.gidx)].homeScore = el.value===''?null:parseInt(el.value); });
    await saveState();
    showMsg('ok','Scores updated.');
  });
  document.querySelectorAll('[data-remove]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const idx = Number(btn.dataset.remove);
    state.games[adminWeek].splice(idx,1);
    await saveState();
    showMsg('ok','Game removed.');
  }));
  const cpUserSel = document.getElementById('cp-user-select');
  if(cpUserSel) cpUserSel.addEventListener('change', ()=>{ correctPickUserId = cpUserSel.value; correctPickEntryId = null; render(); });
  const cpEntrySel = document.getElementById('cp-entry-select');
  if(cpEntrySel) cpEntrySel.addEventListener('change', ()=>{ correctPickEntryId = cpEntrySel.value; render(); });
  const cpWeekSel = document.getElementById('cp-week-select');
  if(cpWeekSel) cpWeekSel.addEventListener('change', ()=>{ correctPickWeek = Number(cpWeekSel.value); render(); });
  const cpSaveBtn = document.getElementById('cp-save');
  if(cpSaveBtn) cpSaveBtn.addEventListener('click', async ()=>{
    const entry = state.entries.find(e=>e.id===correctPickEntryId);
    if(!entry) return;
    const survivorVal = document.getElementById('cp-survivor-select').value;
    const highscoreVal = document.getElementById('cp-highscore-select').value;
    if(!entry.picks[correctPickWeek]) entry.picks[correctPickWeek] = {};
    if(survivorVal) entry.picks[correctPickWeek].survivor = survivorVal;
    else delete entry.picks[correctPickWeek].survivor;
    if(highscoreVal) entry.picks[correctPickWeek].highscore = highscoreVal;
    else delete entry.picks[correctPickWeek].highscore;
    if(Object.keys(entry.picks[correctPickWeek]).length===0) delete entry.picks[correctPickWeek];
    const wasEliminated = entry.eliminated;
    recalculateEntryStatus(entry);
    await saveState();
    const statusNote = wasEliminated!==entry.eliminated ? ` Status changed to ${entry.eliminated?'eliminated':'alive'}.` : '';
    showMsg('ok', `Pick corrected for Week ${correctPickWeek}.${statusNote}`);
  });
  const processWeek = document.getElementById('process-week');
  if(processWeek) processWeek.addEventListener('click', async ()=>{
    const week = adminWeek;
    const withinBuyBackWindow = week <= BUY_BACK_CUTOFF_WEEK;
    let eliminatedCount = 0, revivedCount = 0;
    state.entries.forEach(entry=>{
      const wasOut = entry.eliminated;
      // Once buy-back closes, an already-eliminated entry can't come back — skip entirely.
      if(wasOut && !withinBuyBackWindow) return;
      const pick = entry.picks[week];
      if(!pick || !pick.survivor){
        // No pick this week: newly-eliminated entries lock in; already-out entries just
        // stay out under their original elimination week (they simply didn't buy back).
        if(!wasOut){ entry.eliminated = true; entry.eliminatedWeek = week; eliminatedCount++; }
        return;
      }
      const result = gameResultForTeam(week, pick.survivor);
      if(result==='loss'){
        entry.eliminated = true; entry.eliminatedWeek = week;
        if(!wasOut) eliminatedCount++;
      } else if(result==='win' || result==='tie'){
        if(wasOut){ entry.eliminated = false; entry.eliminatedWeek = null; revivedCount++; }
      }
      // result === null means the game isn't final yet — leave status as-is.
    });
    await saveState();
    showMsg('ok', `Week ${week} processed. ${eliminatedCount} entr${eliminatedCount===1?'y':'ies'} eliminated.${revivedCount?` ${revivedCount} entr${revivedCount===1?'y':'ies'} bought back in.`:''}`);
  });
  const advanceWeek = document.getElementById('advance-week');
  if(advanceWeek) advanceWeek.addEventListener('click', async ()=>{
    state.meta.currentWeek += 1;
    adminWeek = state.meta.currentWeek;
    stagedGames = null;
    refreshWindowTimestamps();
    await saveState();
    showMsg('ok','Advanced to Week '+state.meta.currentWeek+'.');
  });
  document.querySelectorAll('[data-add-entry]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const userId = btn.dataset.addEntry;
    const count = userEntries(userId).length;
    state.entries.push({ id: uid('e'), userId, label: 'Entry '+(count+1), eliminated:false, eliminatedWeek:null, picks:{} });
    await saveState();
    showMsg('ok','Entry added.');
  }));
  document.querySelectorAll('[data-make-admin]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const userId = btn.dataset.makeAdmin;
    const user = state.users.find(u=>u.id===userId);
    if(user){
      user.isAdmin = true;
      await saveState();
      showMsg('ok', `${user.displayName} is now an admin.`);
    }
  }));
  document.querySelectorAll('[data-remove-user]').forEach(btn=>btn.addEventListener('click', ()=>{
    confirmingRemoveUserId = btn.dataset.removeUser;
    render();
  }));
  document.querySelectorAll('[data-cancel-remove-user]').forEach(btn=>btn.addEventListener('click', ()=>{
    confirmingRemoveUserId = null;
    render();
  }));
  document.querySelectorAll('[data-confirm-remove-user]').forEach(btn=>btn.addEventListener('click', async ()=>{
    const userId = btn.dataset.confirmRemoveUser;
    const user = state.users.find(u=>u.id===userId);
    if(!user) return;
    state.users = state.users.filter(u=>u.id!==userId);
    state.entries = state.entries.filter(e=>e.userId!==userId);
    confirmingRemoveUserId = null;
    if(session.userId===userId){ session.userId = null; await saveSession(); activeTab = 'home'; }
    await saveState();
    showMsg('ok', `${user.displayName} removed.`);
  }));
  const rosterImportBtn = document.getElementById('roster-import');
  if(rosterImportBtn) rosterImportBtn.addEventListener('click', async ()=>{
    const week = adminWeek;
    const pickType = document.getElementById('roster-import-type').value; // 'survivor' or 'highscore'
    const raw = document.getElementById('roster-csv').value;
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let usersCreated = 0, entriesCreated = 0, picksSet = 0, skipped = [], reusedTeamWarnings = [];

    for(const line of lines){
      // Split on tab first, then fall back to comma, then 2+ spaces.
      let parts = line.split('\t').map(s=>s.trim()).filter(Boolean);
      if(parts.length<2) parts = line.split(',').map(s=>s.trim()).filter(Boolean);
      if(parts.length<2) parts = line.split(/\s{2,}/).map(s=>s.trim()).filter(Boolean);
      if(parts.length<2){ skipped.push(line); continue; }
      const namePart = parts[0];
      const teamPart = parts[parts.length-1];
      if(/^entry( name)?$/i.test(namePart)) continue; // header row

      const teamAbbr = resolveTeamName(teamPart);
      if(!teamAbbr){ skipped.push(line); continue; }

      const m = namePart.match(/^(.*\S)\s+(\d+)$/);
      const baseName = m ? m[1] : namePart;
      const entryNum = m ? parseInt(m[2]) : 1;

      let user = state.users.find(u=>u.displayName.toLowerCase()===baseName.toLowerCase());
      if(!user){
        user = { id: uid('u'), displayName: baseName, isAdmin: false, pending: true, mustChange: true };
        state.users.push(user);
        usersCreated++;
      }
      const label = 'Entry ' + entryNum;
      let entry = state.entries.find(e=>e.userId===user.id && e.label===label);
      if(!entry){
        entry = { id: uid('e'), userId: user.id, label, eliminated:false, eliminatedWeek:null, picks:{} };
        state.entries.push(entry);
        entriesCreated++;
      }
      if(!entry.picks[week]) entry.picks[week] = {};

      if(pickType==='survivor'){
        const usedBefore = Object.entries(entry.picks).filter(([w])=>Number(w)!==week).map(([,p])=>p.survivor);
        if(usedBefore.includes(teamAbbr)) reusedTeamWarnings.push(`${baseName} (${label}) — ${teamAbbr} already used in a prior week`);
        entry.picks[week].survivor = teamAbbr;
      } else {
        entry.picks[week].highscore = teamAbbr;
      }
      picksSet++;
    }

    await saveState();
    const typeLabel = pickType==='survivor' ? 'Survivor' : 'High Score';
    let msg = `Imported (${typeLabel}): ${usersCreated} new user(s), ${entriesCreated} new entr${entriesCreated===1?'y':'ies'}, ${picksSet} pick(s) set for Week ${week}.`;
    if(usersCreated) msg += ' New players are pending — click “Create player logins” in Users & Entries to give them logins.';
    if(skipped.length) msg += ` ${skipped.length} row(s) could not be parsed (unresolved team name or format).`;
    if(reusedTeamWarnings.length) msg += ` ${reusedTeamWarnings.length} pick(s) repeat a team used in an earlier week — check the standings pick history.`;
    showMsg(skipped.length ? 'error' : 'ok', msg);
    if(skipped.length) console.warn('Unparsed roster rows:', skipped);
  });
  const createAccountsBtn = document.getElementById('create-accounts-btn');
  if(createAccountsBtn) createAccountsBtn.addEventListener('click', async ()=>{
    createAccountsBtn.disabled = true;
    await createPendingAccounts();
  });
  const importBackupBtn = document.getElementById('import-backup-btn');
  if(importBackupBtn) importBackupBtn.addEventListener('click', async ()=>{
    const f = document.getElementById('backup-file').files[0];
    if(!f){ showMsg('error','Choose a backup .json file first.'); return; }
    importBackupBtn.disabled = true;
    try{
      setProgress('Reading backup…');
      const obj = JSON.parse(await f.text());
      if(!obj.users || !obj.entries) throw new Error('That file does not look like a league backup.');
      setProgress('Importing data…');
      await importBackup(obj);
      await createPendingAccounts();
    }catch(e){
      showMsg('error', 'Import stopped: ' + (e && e.message ? e.message : e));
    }
  });
}

// ---------- boot ----------
(function(){
  state = defaultState();
  render();
  onAuthStateChanged(auth, async (user)=>{
    fbUser = user;
    if(user){
      loading = true; render();
      try{ await loadAll(); }
      catch(e){ showMsg('error', e && e.code==='permission-denied' ? 'You do not have access to the league data.' : (e.message || String(e))); }
      loading = false;
    } else {
      myProfile = null; state = defaultState(); session = { userId: null }; lastSaved = {}; activeTab = 'home';
    }
    render();
  });
})();
</script>
</body>
